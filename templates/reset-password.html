
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — MFA Security</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}">

</head>

<body>

<main class="auth-shell">

    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>

    <section class="auth-card">

        <div class="brand">

            <span class="badge">
                Account Recovery
            </span>

            <h1 class="brand-title">
                Reset Password
            </h1>

            <p class="subtitle">
                Create a new password for your account.
            </p>

        </div>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="success">
            {{ success }}
        </div>
        {% endif %}

        <form method="POST"
              action="/update_password">

            <div class="field">

                <label for="newPw">
                    New Password
                </label>

                <input
                    id="newPw"
                    type="password"
                    name="new_password"
                    placeholder="Enter New Password"
                    minlength="6"
                    required>

            </div>

            <div class="field">

                <label for="confirmPw">
                    Confirm Password
                </label>

                <input
                    id="confirmPw"
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm New Password"
                    minlength="6"
                    required>

            </div>

            <p class="muted" style="margin-bottom:15px;">
                Password must contain at least 6 characters.
            </p>

            <button
                type="submit"
                class="neon-button">

                Update Password

            </button>

        </form>

        <div class="footer-note">

            <a href="/login"
               class="linkish">

               Back to Login

            </a>

        </div>

    </section>

</main>

</body>
</html>
