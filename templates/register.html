<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Account — Multi-Factor Auth</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

<main class="auth-shell">

    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>

    <section class="auth-card">

        <div class="brand">

            <span class="badge">
                New User Registration
            </span>

            <h1 class="brand-title">
                Create Account
            </h1>

            <p class="subtitle">
                Create your account to access the Multi-Factor Authentication system.
            </p>

        </div>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="success">
            {{ success }}
        </div>
        {% endif %}

        <form method="POST"
              action="/create_account">

            <div class="field">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="field">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required>

            </div>

            <div class="field">

                <label>Confirm Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    minlength="6"
                    required>

            </div>

            <button
                type="submit"
                class="neon-button">

                Create Account

            </button>

        </form>

        <div class="footer-note">

            Already have an account?

            <br><br>

            <a href="/login"
               class="linkish">

                Login Here

            </a>

        </div>

    </section>

</main>

</body>
</html>
