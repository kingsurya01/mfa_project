<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password — MFA Security</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}">

</head>

<body>

<main class="auth-shell">

    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>

    <section class="auth-card">

        <div class="brand">

            <span class="badge">
                Account Recovery
            </span>

            <h1 class="brand-title">
                Forgot Password
            </h1>

            <p class="subtitle">
                Enter your registered email address to receive a password reset OTP.
            </p>

        </div>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="success">
            {{ success }}
        </div>
        {% endif %}

        <form method="POST"
              action="/send_reset_otp">

            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="Enter registered email"
                    required>

            </div>

            <button
                type="submit"
                class="neon-button">

                Send OTP

            </button>

        </form>

        <div class="footer-note">

            <a href="/login"
               class="linkish">

               Back to Login

            </a>

        </div>

    </section>

</main>

</body>
</html>
